# Mêmes règles que le dépôt de référence ha-sdr : admin_phone.py, copié tel quel,
# doit passer ici comme là-bas.
target-version = "py313"
line-length = 100
extend-exclude = ["tests"]

[lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "BLE"]
ignore = ["RUF001", "RUF002", "RUF003"]

[lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true
